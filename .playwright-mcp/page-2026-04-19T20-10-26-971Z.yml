      - heading "AI products introduce new design failure modes." [level=2] [ref=e50]
      - paragraph [ref=e51]: Without intentional leadership, AI features ship with unclear affordances, misaligned expectations, and eroded user trust. The gap between what AI can do and what users understand compounds with every release.
      - paragraph [ref=e52]: Each unexamined decision—a missing loading state, an unexplained failure, an overconfident response—compounds into systemic distrust that's hard to undo and costly to fix.
    - generic [ref=e53]:
      - heading "The right leadership turns AI complexity into a competitive advantage." [level=2] [ref=e54]
      - paragraph [ref=e55]: Deep expertise in both AI product patterns and design strategy enables the pivotal calls that separate products people trust from ones they abandon. It's not just knowing the patterns—it's knowing when to break them.
      - paragraph [ref=e56]: With the right leadership, AI features ship with clarity, users build confidence, and the product improves with every interaction instead of frustrating with every one.
